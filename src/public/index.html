<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI Web Deck</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Drag-and-drop Fullscreen Overlay -->
  <div id="drop-overlay">
    <div class="drop-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop files to upload directly into workspace</p>
    </div>
  </div>

  <div class="deck-container">
    <!-- Header -->
    <header class="deck-header">
      <div class="header-left">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </div>
        <span class="app-title" id="deck-title">CLI Web Deck</span>
        <span class="cmd-badge" id="deck-cmd">bash</span>
      </div>

      <div class="header-right">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </div>

        <button class="header-btn" id="btn-reset-session" title="Reset Session (restart command)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span>Restart</span>
        </button>

        <button class="header-btn active" id="btn-toggle-sidebar" title="Toggle File Explorer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
          <span>Files</span>
        </button>

        <button class="header-btn" id="btn-fullscreen" title="Toggle Fullscreen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="deck-body">
      <!-- Terminal Viewport -->
      <main class="terminal-viewport">
        <iframe id="terminal-frame" src="/terminal/"></iframe>
      </main>

      <!-- File Manager Sidebar -->
      <aside class="files-sidebar" id="files-sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">Workspace Files</span>
          <button class="icon-btn" id="btn-refresh-files" title="Refresh file list">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
          </button>
        </div>

        <!-- Upload Dropzone -->
        <div class="dropzone" id="inline-dropzone">
          <input type="file" id="file-input" multiple style="display: none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <div class="dropzone-text">
            <span>Drop files or </span><a href="javascript:void(0)" onclick="document.getElementById('file-input').click()">browse</a>
          </div>
        </div>

        <!-- File List -->
        <div class="file-list-wrap">
          <ul class="file-list" id="file-list">
            <li class="file-empty">Loading files...</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <div id="toast">File uploaded successfully</div>

  <script src="/client.js"></script>
</body>
</html>
