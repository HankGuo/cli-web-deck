<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .bg-canvas { fill: #0d1117; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .card-deck { fill: #121824; stroke: #3b82f6; stroke-width: 2; rx: 14px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f0f6fc; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      .pill-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .feature-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #c9d1d9; }
      .arrow-line { stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .badge-bg { rx: 6px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <linearGradient id="deck-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="460" rx="16" class="bg-canvas" />

  <!-- Grid Dots / Subtle Ambient -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="200" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="300" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="400" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="500" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="600" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="700" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="800" cy="100" r="1.5" fill="#58a6ff"/>
    <circle cx="100" cy="360" r="1.5" fill="#58a6ff"/>
    <circle cx="300" cy="360" r="1.5" fill="#58a6ff"/>
    <circle cx="500" cy="360" r="1.5" fill="#58a6ff"/>
    <circle cx="700" cy="360" r="1.5" fill="#58a6ff"/>
  </g>

  <!-- Left: Host Machine (Where Agents Live) -->
  <g transform="translate(40, 45)">
    <rect width="260" height="370" class="card-bg" />
    <circle cx="26" cy="26" r="12" fill="#21262d"/>
    <path d="M20 23h12v7H20zM22 30h8" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
    <text x="46" y="27" class="title-text">Host Machine</text>
    <text x="46" y="42" class="sub-text">Where your CLI agents live</text>

    <line x1="20" y1="58" x2="240" y2="58" stroke="#30363d" stroke-width="1"/>

    <!-- Agent Pills -->
    <g transform="translate(18, 75)">
      <!-- Claude Code -->
      <g transform="translate(0, 0)">
        <rect width="224" height="42" fill="#2a1b18" stroke="#d97706" stroke-width="1" class="badge-bg"/>
        <circle cx="20" cy="21" r="6" fill="#d97706"/>
        <text x="36" y="25" class="pill-text" fill="#fbbf24">Claude Code</text>
        <text x="145" y="25" class="sub-text" fill="#92400e">Anthropic CLI</text>
      </g>

      <!-- Codex / OpenAI -->
      <g transform="translate(0, 52)">
        <rect width="224" height="42" fill="#13241b" stroke="#059669" stroke-width="1" class="badge-bg"/>
        <circle cx="20" cy="21" r="6" fill="#10b981"/>
        <text x="36" y="25" class="pill-text" fill="#34d399">Codex / LLM CLI</text>
        <text x="155" y="25" class="sub-text" fill="#065f46">OpenAI CLI</text>
      </g>

      <!-- Kimi Code -->
      <g transform="translate(0, 104)">
        <rect width="224" height="42" fill="#142136" stroke="#2563eb" stroke-width="1" class="badge-bg"/>
        <circle cx="20" cy="21" r="6" fill="#3b82f6"/>
        <text x="36" y="25" class="pill-text" fill="#60a5fa">Kimi Code</text>
        <text x="135" y="25" class="sub-text" fill="#1e40af">1M Context CLI</text>
      </g>

      <!-- MiniMax Code -->
      <g transform="translate(0, 156)">
        <rect width="224" height="42" fill="#281523" stroke="#db2777" stroke-width="1" class="badge-bg"/>
        <circle cx="20" cy="21" r="6" fill="#f43f5e"/>
        <text x="36" y="25" class="pill-text" fill="#fb7185">MiniMax Code</text>
        <text x="140" y="25" class="sub-text" fill="#9d174d">M3.1 Fast CLI</text>
      </g>

      <!-- General Shells / Aider -->
      <g transform="translate(0, 208)">
        <rect width="224" height="42" fill="#161b22" stroke="#484f58" stroke-width="1" class="badge-bg"/>
        <circle cx="20" cy="21" r="6" fill="#8b949e"/>
        <text x="36" y="25" class="pill-text" fill="#c9d1d9">Aider / Python / Bash</text>
      </g>
    </g>
  </g>

  <!-- Center Arrow 1 -->
  <path d="M305 230 L350 230" class="arrow-line" marker-end="url(#arrowhead)"/>
  <rect x="306" y="208" width="40" height="18" fill="#161b22" rx="4"/>
  <text x="312" y="221" font-size="10" fill="#58a6ff" font-family="monospace">tmux</text>

  <!-- Center: CLI Web Deck Engine -->
  <g transform="translate(355, 35)">
    <rect width="260" height="390" class="card-deck" fill="url(#deck-glow)"/>
    
    <g transform="translate(20, 24)">
      <circle cx="16" cy="16" r="14" fill="#1d4ed8"/>
      <path d="M11 16l4 4 6-8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="40" y="16" class="title-text" fill="#60a5fa" font-size="16">CLI Web Deck</text>
      <text x="40" y="32" class="sub-text">Universal Single-Port Bridge</text>
    </g>

    <line x1="20" y1="70" x2="240" y2="70" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Key Engine Capabilities -->
    <g transform="translate(20, 88)">
      
      <!-- Feature 1: Anti-Spam Singleton -->
      <g transform="translate(0, 0)">
        <rect width="220" height="64" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
        <circle cx="16" cy="22" r="5" fill="#10b981"/>
        <text x="28" y="24" class="title-text" font-size="12.5" fill="#34d399">Process Anti-Spam</text>
        <text x="16" y="44" class="sub-text" font-size="11">Strict Session Singleton:</text>
        <text x="16" y="56" class="sub-text" font-size="11">Zero duplicate runaway processes</text>
      </g>

      <!-- Feature 2: File Transfer -->
      <g transform="translate(0, 76)">
        <rect width="220" height="64" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
        <circle cx="16" cy="22" r="5" fill="#38bdf8"/>
        <text x="28" y="24" class="title-text" font-size="12.5" fill="#38bdf8">Bidirectional Drag &amp; Drop</text>
        <text x="16" y="44" class="sub-text" font-size="11">Drop tables/docs into workspace;</text>
        <text x="16" y="56" class="sub-text" font-size="11">1-click download of generated artifacts</text>
      </g>

      <!-- Feature 3: Single Port Web Gateway -->
      <g transform="translate(0, 152)">
        <rect width="220" height="64" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
        <circle cx="16" cy="22" r="5" fill="#a855f7"/>
        <text x="28" y="24" class="title-text" font-size="12.5" fill="#c084fc">Single-Port Multiplexing</text>
        <text x="16" y="44" class="sub-text" font-size="11">UI + WS Terminal + File Upload</text>
        <text x="16" y="56" class="sub-text" font-size="11">All on port :8080 (IP or Domain)</text>
      </g>

      <!-- Feature 4: Persistence -->
      <g transform="translate(0, 228)">
        <rect width="220" height="52" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
        <circle cx="16" cy="20" r="5" fill="#f59e0b"/>
        <text x="28" y="22" class="title-text" font-size="12.5" fill="#fbbf24">Network Resilient</text>
        <text x="16" y="38" class="sub-text" font-size="11">Close tab anytime, jobs run 24/7</text>
      </g>

    </g>
  </g>

  <!-- Center Arrow 2 -->
  <path d="M620 230 L660 230" class="arrow-line" marker-end="url(#arrowhead)"/>
  <rect x="622" y="208" width="36" height="18" fill="#161b22" rx="4"/>
  <text x="626" y="221" font-size="10" fill="#58a6ff" font-family="monospace">HTTP</text>

  <!-- Right: Client Devices (Any Browser) -->
  <g transform="translate(665, 45)">
    <rect width="255" height="370" class="card-bg" />
    <circle cx="26" cy="26" r="12" fill="#21262d"/>
    <path d="M18 20h16v10H18zM24 30v4m-4 0h8" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
    <text x="46" y="27" class="title-text">Any Client Device</text>
    <text x="46" y="42" class="sub-text">Wherever you have a browser</text>

    <line x1="20" y1="58" x2="235" y2="58" stroke="#30363d" stroke-width="1"/>

    <!-- Device Examples -->
    <g transform="translate(18, 75)">
      <g transform="translate(0, 0)">
        <rect width="219" height="54" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/>
        <text x="14" y="23" class="title-text" font-size="13">💻 Laptop / Office PC</text>
        <text x="14" y="40" class="sub-text">Zero tools/runtime required locally</text>
      </g>

      <g transform="translate(0, 66)">
        <rect width="219" height="54" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/>
        <text x="14" y="23" class="title-text" font-size="13">📱 iPad / Android Tablet</text>
        <text x="14" y="40" class="sub-text">Full keyboard &amp; touch terminal</text>
      </g>

      <g transform="translate(0, 132)">
        <rect width="219" height="54" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/>
        <text x="14" y="23" class="title-text" font-size="13">🔒 Managed Workstations</text>
        <text x="14" y="40" class="sub-text">Inconvenient to install dev tools</text>
      </g>

      <g transform="translate(0, 198)">
        <rect width="219" height="60" fill="#13241b" stroke="#059669" stroke-width="1" rx="8"/>
        <text x="14" y="24" class="title-text" font-size="12.5" fill="#34d399">✨ Experience Equivalent To:</text>
        <text x="14" y="42" class="sub-text" fill="#a7f3d0">Sitting right in front of your host machine</text>
      </g>
    </g>
  </g>
</svg>
