# Nginx Reverse Proxy Configuration for CLI Web Deck
# Place in /etc/nginx/conf.d/cli-web-deck.conf

server {
    listen 80;
    server_name your-domain.com; # Or your server public IP

    # Maximum upload size for drag-and-drop file transfers
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (Crucial for TTYD terminal connection)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time terminal streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
